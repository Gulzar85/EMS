{% extends "base/app.html" %}

{% block title %}{{ page_title }} — EMS{% endblock %}
{% block page_content %}
<div class="mx-auto max-w-md">
  <c-card title="Activate {{ theme.name }}">
    <p class="mb-4 text-sm text-secondary">
      This makes "{{ theme.name }}" the site's active theme, replacing whichever theme is
      currently live. No new version is created.
    </p>
    <form method="post">
      {% csrf_token %}
      <div class="flex gap-2">
        <c-button type="submit" variant="primary">Activate</c-button>
        <c-button variant="secondary" href="{% url 'theme:detail' theme.public_id %}">Cancel</c-button>
      </div>
    </form>
  </c-card>
</div>
{% endblock %}
