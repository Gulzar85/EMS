{% load icons %}
<header class="sticky top-0 z-20 flex h-[var(--navbar-height)] items-center justify-between border-b border-default bg-surface px-4">
  <div class="flex items-center gap-3">
    <button
      type="button"
      @click="toggleMobileSidebar()"
      class="flex items-center justify-center rounded-[var(--radius-button)] p-2 text-secondary hover:bg-background lg:hidden"
      :aria-expanded="mobileSidebarOpen"
      aria-label="Toggle navigation menu"
    >
      {% icon "menu" size=20 %}
    </button>
    {% include "layouts/_breadcrumbs.html" %}
  </div>

  <div class="relative flex items-center gap-2" x-data="dropdown">
    <button
      type="button"
      @click="toggle()"
      @click.outside="close()"
      @keydown.escape.window="close()"
      :aria-expanded="open"
      aria-haspopup="true"
      class="flex items-center gap-2 rounded-[var(--radius-button)] px-2 py-1.5 text-sm text-primary hover:bg-background"
    >
      <span class="flex h-7 w-7 items-center justify-center rounded-full bg-brand text-xs font-semibold text-white">
        {{ request.user.get_short_name|slice:":1"|upper }}
      </span>
      <span class="hidden sm:inline">{{ request.user.get_full_name }}</span>
      {% icon "chevron-down" size=16 class_name="text-secondary" %}
    </button>

    <div
      x-show="open"
      x-cloak
      x-transition
      class="absolute right-0 top-full mt-2 w-48 rounded-[var(--radius-card)] border border-default bg-surface py-1 shadow-lg"
      role="menu"
    >
      <div class="border-b border-default px-3 py-2 text-xs text-secondary">{{ request.user.email }}</div>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" role="menuitem" class="flex w-full items-center gap-2 px-3 py-2 text-left text-sm text-primary hover:bg-background">
          {% icon "log-out" size=16 %}
          Sign out
        </button>
      </form>
    </div>
  </div>
</header>
