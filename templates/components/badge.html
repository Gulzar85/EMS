{% cotton:vars variant="default" class="" %}
<span
  {{ attrs }}
  class="inline-flex items-center rounded-full px-2.5 py-0.5 text-xs font-medium
    {% if variant == 'success' %}bg-success/10 text-success
    {% elif variant == 'warning' %}bg-warning/10 text-warning
    {% elif variant == 'danger' %}bg-danger/10 text-danger
    {% elif variant == 'info' %}bg-info/10 text-info
    {% elif variant == 'brand' %}bg-brand/10 text-brand
    {% else %}bg-background text-secondary{% endif %} {{ class }}"
>{{ slot }}</span>
