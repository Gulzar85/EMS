{% load icons %}
{% cotton:vars icon="info" title="Nothing here yet" description="" class="" %}
<div class="flex flex-col items-center gap-2 rounded-[var(--radius-card)] border border-dashed border-default px-6 py-12 text-center {{ class }}">
  {% icon icon size=32 class_name="text-secondary" %}
  <p class="font-medium text-primary">{{ title }}</p>
  {% if description %}<p class="max-w-sm text-sm text-secondary">{{ description }}</p>{% endif %}
  {% if slot %}<div class="mt-2">{{ slot }}</div>{% endif %}
</div>
