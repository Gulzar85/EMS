{% load crispy_forms_tags %}
<form
  id="department-form"
  method="post"
  action="{% if department %}{% url 'organization:department-update' department.public_id %}{% else %}{% url 'organization:department-create' %}{% endif %}"
>
  {% csrf_token %}
  <p class="mb-4 text-sm text-secondary">Set exactly one of Organization Unit or Location.</p>
  {{ form|crispy }}
  <div class="mt-4 flex gap-2">
    <c-button type="submit" variant="primary">Save</c-button>
    <c-button variant="secondary" href="{% if department %}{% url 'organization:department-detail' department.public_id %}{% else %}{% url 'organization:department-list' %}{% endif %}">Cancel</c-button>
  </div>
</form>
